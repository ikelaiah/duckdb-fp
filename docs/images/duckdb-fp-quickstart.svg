<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">duckdb-fp quickstart</title>
  <desc id="description">A Free Pascal quickstart showing duckdb-fp loading a CSV into a TDuckFrame, printing it, and reporting the row count.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2d"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ba3c7" stroke-width="1" opacity=".05"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="958" height="558" rx="28"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="958" height="558" rx="28" fill="url(#background)" stroke="#263653" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="558" fill="url(#grid)" clip-path="url(#frame)" opacity=".45"/>

  <path d="M1 29Q1 1 29 1H931Q959 1 959 29V72H1Z" fill="#16202f" clip-path="url(#frame)"/>
  <path d="M1 72H959" stroke="#263653" stroke-width="2"/>
  <circle cx="44" cy="37" r="7" fill="#334155"/>
  <circle cx="70" cy="37" r="7" fill="#334155"/>
  <circle cx="96" cy="37" r="7" fill="#334155"/>
  <text x="480" y="43" text-anchor="middle" fill="#64748b"
        font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="17" letter-spacing="1">quickstart.pas</text>
  <rect x="820" y="26" width="106" height="24" rx="12" fill="url(#accent)" opacity=".18"/>
  <text x="873" y="43" text-anchor="middle" fill="#67e8f9"
        font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1">PASCAL</text>

  <g font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="21">
    <g fill="#3d4a63" font-size="17" text-anchor="end">
      <text x="78" y="132">1</text>
      <text x="78" y="161">2</text>
      <text x="78" y="190">3</text>
      <text x="78" y="219">4</text>
      <text x="78" y="248">5</text>
      <text x="78" y="277">6</text>
      <text x="78" y="306">7</text>
      <text x="78" y="335">8</text>
      <text x="78" y="364">9</text>
      <text x="78" y="393">10</text>
      <text x="78" y="422">11</text>
      <text x="78" y="451">12</text>
      <text x="78" y="480">13</text>
      <text x="78" y="509">14</text>
    </g>

    <text x="110" y="132"><tspan fill="#67e8f9">uses</tspan><tspan fill="#79c0ff"> DuckDB.Wrapper, DuckDB.DataFrame</tspan><tspan fill="#8b9cb8">;</tspan></text>

    <text x="110" y="190"><tspan fill="#67e8f9">var</tspan></text>
    <text x="136" y="219"><tspan fill="#e6edf3">F </tspan><tspan fill="#8b9cb8">: </tspan><tspan fill="#79c0ff">TDuckFrame</tspan><tspan fill="#8b9cb8">;</tspan></text>

    <text x="110" y="277"><tspan fill="#67e8f9">begin</tspan></text>
    <text x="136" y="306"><tspan fill="#e6edf3">F </tspan><tspan fill="#8b9cb8">:= </tspan><tspan fill="#79c0ff">TDuckFrame</tspan><tspan fill="#8b9cb8">.</tspan><tspan fill="#e6edf3">CreateFromCSV</tspan><tspan fill="#8b9cb8">(</tspan><tspan fill="#7ee787">'data.csv'</tspan><tspan fill="#8b9cb8">);</tspan></text>
    <text x="136" y="335"><tspan fill="#67e8f9">try</tspan></text>
    <text x="162" y="364"><tspan fill="#e6edf3">F</tspan><tspan fill="#8b9cb8">.</tspan><tspan fill="#e6edf3">Print</tspan><tspan fill="#8b9cb8">;</tspan></text>
    <text x="162" y="393"><tspan fill="#79c0ff">WriteLn</tspan><tspan fill="#8b9cb8">(</tspan><tspan fill="#7ee787">'rows: '</tspan><tspan fill="#8b9cb8">, </tspan><tspan fill="#e6edf3">F</tspan><tspan fill="#8b9cb8">.</tspan><tspan fill="#e6edf3">RowCount</tspan><tspan fill="#8b9cb8">);</tspan></text>
    <text x="136" y="422"><tspan fill="#67e8f9">finally</tspan></text>
    <text x="162" y="451"><tspan fill="#e6edf3">F</tspan><tspan fill="#8b9cb8">.</tspan><tspan fill="#e6edf3">Free</tspan><tspan fill="#8b9cb8">;</tspan></text>
    <text x="136" y="480"><tspan fill="#67e8f9">end</tspan><tspan fill="#8b9cb8">;</tspan></text>
    <text x="110" y="509"><tspan fill="#67e8f9">end</tspan><tspan fill="#8b9cb8">.</tspan></text>
  </g>

  <path d="M30 532H930" stroke="#263653" stroke-width="2" opacity=".7"/>
  <path d="M30 532H150" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
</svg>
